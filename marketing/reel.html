<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WindX film (render source)</title>
<link rel="stylesheet" href="../site/island.css">
<style>
  /* 1080 x 1920. Rendered frame by frame by render.js: every motion is a seekable Web Animation. */
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { position: relative; color: #f5f5f7; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .abs { position: absolute; }
  .c { left: 0; right: 0; text-align: center; }
  .hot { background: linear-gradient(90deg, #ffb38a, #ff5b1f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .glow { position: absolute; left: 50%; width: 1500px; height: 1500px; margin-left: -750px; border-radius: 50%; filter: blur(120px); opacity: 0; }
  .t { font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; }
  .s { font-weight: 500; color: #a1a1a6; letter-spacing: -0.015em; }
  .streak { position: absolute; left: 0; height: 3px; border-radius: 3px; opacity: 0; }

  #logo svg { width: 300px; height: 300px; }
  #logo path, #outro path { stroke-dasharray: 100; stroke-dashoffset: 100; }
  #word { font-size: 170px; margin-top: 20px; opacity: 0; }

  .beat { font-size: 150px; opacity: 0; }
  #stage { left: 50%; top: 640px; transform: translateX(-50%) scale(2.35); transform-origin: top center; }
  #reflect { left: 0; right: 0; top: 1030px; height: 600px; background: radial-gradient(50% 40% at 50% 0%, rgba(255,91,31,.18), transparent); opacity: 0; }

  .shot { left: 50%; top: 760px; width: 960px; margin-left: -480px; opacity: 0; filter: drop-shadow(0 50px 80px rgba(0,0,0,.8)); }
  .label { top: 300px; font-size: 200px; opacity: 0; }
  .sub { top: 1500px; font-size: 48px; opacity: 0; }

  .num { font-size: 190px; opacity: 0; }
  .numl { font-size: 54px; opacity: 0; margin-top: -6px; }

  #outro { top: 560px; opacity: 0; }
  #outro svg { width: 220px; height: 220px; }
  #outro h1 { font-size: 160px; margin: 18px 0 0; }
  #ofree { font-size: 56px; margin-top: 26px; }
  #url { display: inline-block; margin-top: 70px; padding: 30px 60px; border-radius: 99px; background: #ff5b1f; color: #fff; font-size: 42px; font-weight: 600; letter-spacing: -0.02em; opacity: 0;
    box-shadow: 0 40px 100px -30px rgba(255,91,31,.9); }
</style>
</head>
<body>
<div class="glow" id="g0" style="top:-200px;background:#ff5b1f"></div>
<div class="glow" id="g1" style="top:300px;background:#ff3d0a"></div>
<div class="glow" id="g2" style="top:300px;background:#1d7fd6"></div>
<div class="glow" id="g3" style="top:300px;background:#7c4dff"></div>
<div class="glow" id="g4" style="top:300px;background:#a8e63a"></div>
<div class="glow" id="g5" style="top:300px;background:#ff7ea6"></div>
<div class="glow" id="g6" style="top:300px;background:#ffd60a"></div>
<div class="glow" id="g7" style="top:300px;background:#ff5b1f"></div>
<div id="streaks"></div>

<!-- intro -->
<div class="abs c" id="logo" style="top:600px">
  <svg viewBox="0 0 64 64" fill="none" stroke-width="5.4" stroke-linecap="round">
    <path pathLength="100" stroke="#f4f1ea" d="M10 23H36A8 8 0 1 0 28 15"/><path pathLength="100" stroke="#ff5b1f" d="M5 33H47A9 9 0 1 1 38 42"/><path pathLength="100" stroke="#f4f1ea" d="M15 43H25A6 6 0 1 1 19 49"/>
  </svg>
  <div class="t" id="word">Wind<span style="color:#ff5b1f">X</span></div>
</div>

<!-- beats -->
<div class="abs c t beat" id="b1" style="top:700px">Your screen</div>
<div class="abs c t beat" id="b2" style="top:870px">has a new <span class="hot">top.</span></div>

<!-- live island -->
<div class="abs" id="stage"></div>
<div class="abs" id="reflect"></div>
<div class="abs c s sub" id="cap1">It lives where you look.</div>

<!-- effects montage -->
<div class="abs c t label">Fire.</div><img class="abs shot" src="../site/shots/fire-home.png">
<div class="abs c t label">Water.</div><img class="abs shot" src="../site/shots/water-home.png">
<div class="abs c t label">Galaxy.</div><img class="abs shot" src="../site/shots/galaxy-home.png">
<div class="abs c t label">Thunder.</div><img class="abs shot" src="../site/shots/thunder-home.png">
<div class="abs c t label">Sakura.</div><img class="abs shot" src="../site/shots/sakura-calendar.png">
<div class="abs c t label">Lights out.</div><img class="abs shot" src="../site/shots/race-home.png">
<div class="abs c t label" style="font-size:180px">Time, kept.</div><img class="abs shot" src="../site/shots/ribbons-focus.png">
<div class="abs c s sub" id="cap2">24 living effects. Drawn live, not videos.</div>
<div class="abs c s sub" id="cap3">Timer, Pomodoro and reminders.</div>

<!-- numbers -->
<div class="abs c" style="top:520px">
  <div class="t num hot">24</div><div class="s numl">living effects</div>
  <div class="t num hot" style="margin-top:60px">26</div><div class="s numl">themes</div>
  <div class="t num hot" style="margin-top:60px">0</div><div class="s numl">trackers</div>
</div>

<!-- outro -->
<div class="abs c" id="outro">
  <svg viewBox="0 0 64 64" fill="none" stroke-width="5.4" stroke-linecap="round">
    <path pathLength="100" stroke="#f4f1ea" d="M10 23H36A8 8 0 1 0 28 15"/><path pathLength="100" stroke="#ff5b1f" d="M5 33H47A9 9 0 1 1 38 42"/><path pathLength="100" stroke="#f4f1ea" d="M15 43H25A6 6 0 1 1 19 49"/>
  </svg>
  <h1 class="t">Wind<span style="color:#ff5b1f">X</span></h1>
  <div class="s" id="ofree">Free. For Windows.</div>
  <div id="url">be24b034-hue.github.io/windx</div>
</div>

<script src="../site/island.js"></script>
<script>
(function () {
  "use strict";
  const W = WindXIsland, TOTAL = 27, $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
  const tl = new W.Timeline(TOTAL);
  const OUT = "cubic-bezier(.16,1,.3,1)", IN = "cubic-bezier(.7,0,.84,0)";
  const show = (el, a, b, from = "translateY(60px)", to = "translateY(-40px)") => tl.track(el, [
    [a, { opacity: 0, transform: from }, OUT], [a + 0.7, { opacity: 1, transform: "none" }],
    [b - 0.25, { opacity: 1, transform: "none" }, IN], [b, { opacity: 0, transform: to }]]);
  const glow = (el, a, b, o = 0.32) => tl.track(el, [[a, { opacity: 0 }, OUT], [a + 0.9, { opacity: o }], [b - 0.3, { opacity: o }], [b + 0.3, { opacity: 0 }]]);

  // --- 0 – 2.9: the wind draws the logo
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 26; i++) {
    const s = document.createElement("div"); s.className = "streak";
    const len = 220 + rnd() * 520, c = i % 3 === 1 ? "255,91,31" : "244,241,234";
    Object.assign(s.style, { width: len + "px", top: 520 + rnd() * 900 + "px", height: 2 + rnd() * 3 + "px",
      background: `linear-gradient(90deg, rgba(${c},0), rgba(${c},.9) 80%, rgba(${c},0))` });
    $("#streaks").appendChild(s);
    const a = 0.05 + i * 0.045 + rnd() * 0.15, d = 0.6 + rnd() * 0.5;
    tl.track(s, [[a, { transform: `translateX(${-len}px)`, opacity: 0 }, "linear"], [a + d * 0.35, { opacity: 0.85, transform: `translateX(${(1080 + len) * 0.35 - len}px)` }, "linear"], [a + d, { transform: "translateX(1100px)", opacity: 0 }]]);
  }
  $$("#logo path").forEach((p, i) => tl.track(p, [[0.35 + i * 0.2, { strokeDashoffset: 100 }, OUT], [1.6 + i * 0.2, { strokeDashoffset: 0 }]]));
  tl.track($("#word"), [[1.3, { opacity: 0, transform: "translateY(60px)" }, OUT], [2.0, { opacity: 1, transform: "none" }]]);
  tl.track($("#logo"), [[0, { opacity: 1, transform: "scale(1)" }], [2.5, { opacity: 1, transform: "scale(1)" }, IN], [2.9, { opacity: 0, transform: "scale(1.15)" }]]);
  glow($("#g0"), 0.2, 2.9, 0.22);

  // --- 2.9 – 5.2: the line
  show($("#b1"), 3.0, 5.2);
  show($("#b2"), 3.4, 5.2);

  // --- 5.2 – 9.4: the real island, morphing
  const isl = W.create($("#stage"), "Midnight");
  W.script(tl, isl, [["compact", 0], ["music", 6.0], ["vol", 7.1], ["media", 8.0]], 9.6);
  tl.track($("#stage"), [[0, { opacity: 0 }], [5.2, { opacity: 0, transform: "translateX(-50%) scale(2.1)" }, OUT], [5.8, { opacity: 1, transform: "translateX(-50%) scale(2.35)" }],
    [9.2, { opacity: 1, transform: "translateX(-50%) scale(2.35)" }, IN], [9.6, { opacity: 0, transform: "translateX(-50%) scale(2.6)" }]]);
  glow($("#reflect"), 5.4, 9.5, 1);
  show($("#cap1"), 5.6, 9.4, "translateY(30px)", "translateY(0)");

  // --- 9.6 – 20.4: effects montage, one element per beat
  const labels = $$(".label"), shots = $$(".shot"), dur = [1.5, 1.5, 1.5, 1.5, 1.5, 1.6, 2.2];
  let t = 9.6;
  labels.forEach((l, i) => {
    const a = t, b = t + dur[i];
    tl.track(l, [[a, { opacity: 0, transform: "translateY(50px) scale(.96)" }, OUT], [a + 0.5, { opacity: 1, transform: "none" }], [b - 0.15, { opacity: 1, transform: "none" }, IN], [b + 0.05, { opacity: 0, transform: "translateY(-30px)" }]]);
    tl.track(shots[i], [[a, { opacity: 0, transform: "scale(.86) translateY(60px)" }, OUT], [a + 0.6, { opacity: 1, transform: "scale(.97)" }, "linear"],
      [b - 0.15, { opacity: 1, transform: "scale(1.02)" }, IN], [b + 0.05, { opacity: 0, transform: "scale(1.08)" }]]);
    glow($("#g" + (i + 1)), a, b, 0.3);
    t = b;
  });
  show($("#cap2"), 9.8, 17.9, "translateY(30px)", "translateY(0)");
  show($("#cap3"), 18.1, 20.3, "translateY(30px)", "translateY(0)");

  // --- 20.5 – 23.2: numbers
  const nums = $$(".num"), numl = $$(".numl");
  nums.forEach((n, i) => {
    tl.track(n, [[21.1 + i * 0.3, { opacity: 0, transform: "translateY(60px)" }, OUT], [21.7 + i * 0.3, { opacity: 1, transform: "none" }], [23.3, { opacity: 1, transform: "none" }, IN], [23.6, { opacity: 0, transform: "translateY(-30px)" }]]);
    tl.track(numl[i], [[21.25 + i * 0.3, { opacity: 0 }, OUT], [21.8 + i * 0.3, { opacity: 1 }], [23.3, { opacity: 1 }], [23.6, { opacity: 0 }]]);
  });

  // --- 23.3 – 26.5: outro
  tl.track($("#outro"), [[23.7, { opacity: 0, transform: "scale(.94)" }, OUT], [24.4, { opacity: 1, transform: "none" }]]);
  $$("#outro path").forEach((p, i) => tl.track(p, [[23.8 + i * 0.15, { strokeDashoffset: 100 }, OUT], [24.8 + i * 0.15, { strokeDashoffset: 0 }]]));
  tl.track($("#url"), [[24.8, { opacity: 0, transform: "translateY(40px) scale(.94)" }, W.SPRING], [25.5, { opacity: 1, transform: "none" }]]);
  glow($("#g7"), 23.6, 27, 0.26);

  tl.build(false);
  tl.seek(0);
  window.TOTAL = TOTAL;
  window.seek = (x) => tl.seek(x);
  if (location.search.includes("play")) tl.anims.forEach((a) => { a.currentTime = 0; a.play(); });
})();
</script>
</body>
</html>
